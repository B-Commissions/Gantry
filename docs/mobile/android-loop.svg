<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="android-title android-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="android-title">The gantry mobile dev android loop</title>
  <desc id="android-desc">gantry mobile dev android checks the toolchain, finds the one USB device, builds an APK for its ABI, installs and launches it, then streams the app's logcat under the gantry-go tag.</desc>
  <defs>
    <marker id="al-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- arrows -->
  <path d="M 192 164 H 224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#al-arrow)"/>
  <path d="M 384 164 H 416" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#al-arrow)"/>
  <path d="M 576 164 H 608" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#al-arrow)"/>
  <path d="M 768 164 H 800" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#al-arrow)"/>

  <!-- 1 toolchain -->
  <rect x="32" y="120" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="128" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="57" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
  <text x="112" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">check toolchain</text>
  <text x="112" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">offer to install</text>

  <!-- 2 device -->
  <rect x="224" y="120" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="224" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="232" y="128" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="247" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">ADB</text>
  <text x="304" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">find USB device</text>
  <text x="304" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">reject wifi</text>

  <!-- 3 build -->
  <rect x="416" y="120" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="416" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="424" y="128" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="439" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">APK</text>
  <text x="496" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">build APK</text>
  <text x="496" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">device ABI</text>

  <!-- 4 install+launch -->
  <rect x="608" y="120" width="160" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="608" y="120" width="160" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="616" y="128" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="631" y="137" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
  <text x="688" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">install + launch</text>
  <text x="688" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">.MainActivity</text>

  <!-- 5 logcat (focal) -->
  <rect x="800" y="120" width="168" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="800" y="120" width="168" height="88" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <rect x="808" y="128" width="30" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="823" y="137" fill="#eb6c36" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
  <text x="884" y="164" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">stream logcat</text>
  <text x="884" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">tag gantry-go</text>

  <!-- aside -->
  <text x="500" y="252" fill="#4f5d75" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="middle">The phone must be plugged in over USB; adb-over-wifi is rejected on purpose.</text>

  <!-- legend -->
  <line x1="32" y1="284" x2="968" y2="284" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <text x="32" y="300" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LOOP</text>
  <rect x="112" y="292" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="128" y="300" fill="#4f5d75" font-size="9">step</text>
  <rect x="196" y="292" width="10" height="10" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="212" y="300" fill="#4f5d75" font-size="9">live until Ctrl+C</text>
</svg>
