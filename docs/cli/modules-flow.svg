<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-labelledby="modflow-title modflow-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="modflow-title">Installing a Gantry module and merging its docs</title>
  <desc id="modflow-desc">A Gantry module install builds the module's provider, which registers the module and caches its docs; gantry docs and its MCP server then read that cache alongside the embedded framework docs and serve them as one corpus.</desc>
  <defs>
    <marker id="mf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="mf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- arrows (behind boxes) -->
  <!-- install -> provider -->
  <path d="M 208 172 H 256" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#mf-arrow)"/>
  <!-- provider -> installed -->
  <path d="M 408 172 H 456" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#mf-arrow)"/>
  <!-- installed -> gantry docs -->
  <path d="M 632 164 H 684 a8 8 0 0 1 8 8 V 156 q0 -8 8 -8 H 712" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mf-arrow-accent)"/>
  <!-- framework docs -> gantry docs (routes below the store, then up) -->
  <path d="M 632 312 H 700 q8 0 8 -8 V 208 q0 -8 8 -8 H 712" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mf-arrow)"/>

  <!-- arrow labels -->
  <rect x="214" y="150" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="232" y="159" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>

  <rect x="410" y="150" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="436" y="159" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

  <rect x="640" y="138" width="34" height="12" rx="2" fill="#f5f5f5"/>
  <text x="657" y="147" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

  <rect x="636" y="290" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="656" y="299" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">EMBED</text>

  <!-- install (command) -->
  <rect x="32" y="140" width="176" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="140" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="40" y="148" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="55" y="157" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
  <text x="120" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">gantry module install</text>

  <!-- provider -->
  <rect x="256" y="140" width="152" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="256" y="140" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="264" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="278" y="157" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">BIN</text>
  <text x="332" y="180" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">provider</text>
  <text x="332" y="196" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">gantrymod</text>

  <!-- installed module (store) -->
  <rect x="456" y="140" width="176" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="140" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="464" y="148" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
  <text x="484" y="157" fill="#4f5d75" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="544" y="180" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">installed module</text>
  <text x="544" y="196" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">registry + docs cache</text>

  <!-- framework docs (input) -->
  <rect x="456" y="280" width="176" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="280" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <rect x="464" y="288" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
  <text x="481" y="297" fill="#4f5d75" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DOCS</text>
  <text x="544" y="320" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">framework docs</text>
  <text x="544" y="336" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">embedded</text>

  <!-- gantry docs (focal) -->
  <rect x="712" y="120" width="176" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="712" y="120" width="176" height="104" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <rect x="720" y="128" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="742" y="137" fill="#eb6c36" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SERVE</text>
  <text x="800" y="172" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">gantry docs</text>
  <text x="800" y="188" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">and --mcp</text>
  <text x="800" y="208" fill="#7a8399" font-size="9" text-anchor="middle">one merged corpus</text>

  <!-- legend -->
  <line x1="32" y1="360" x2="888" y2="360" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <text x="32" y="376" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="368" width="10" height="10" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="136" y="376" fill="#4f5d75" font-size="9">served result</text>
  <rect x="240" y="368" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="256" y="376" fill="#4f5d75" font-size="9">store</text>
  <line x1="330" y1="373" x2="356" y2="373" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="362" y="376" fill="#4f5d75" font-size="9">read / embed</text>
</svg>
