<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="chrome-title chrome-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="chrome-title">The frameless window hit-test zones</title>
  <desc id="chrome-desc">A frameless Gantry window: a top caption band drags the window (HTCAPTION) except for a small left reserve and a right reserve that holds the window buttons; the rest is HTCLIENT, and a thin resize margin around every edge starts a native resize.</desc>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- window outer frame -->
  <rect x="140" y="88" width="560" height="272" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <!-- resize margin band -->
  <rect x="148" y="96" width="544" height="256" rx="6" fill="none" stroke="rgba(235,108,54,0.5)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- caption band (focal drag zone) -->
  <rect x="148" y="96" width="544" height="48" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="360" y="124" fill="#7a8399" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">drag · HTCAPTION</text>

  <!-- left reserve -->
  <rect x="148" y="96" width="28" height="48" fill="rgba(79,93,117,0.12)" stroke="rgba(122,131,153,0.7)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- right reserve + window buttons -->
  <rect x="564" y="96" width="128" height="48" fill="rgba(79,93,117,0.12)" stroke="rgba(122,131,153,0.7)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="588" y="124" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">buttons</text>
  <circle cx="636" cy="120" r="5" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <circle cx="656" cy="120" r="5" fill="none" stroke="#4f5d75" stroke-width="1"/>
  <circle cx="676" cy="120" r="5" fill="none" stroke="#4f5d75" stroke-width="1"/>

  <!-- client area -->
  <rect x="148" y="144" width="544" height="208" fill="rgba(45,49,66,0.02)"/>
  <text x="420" y="252" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">HTCLIENT</text>
  <text x="420" y="272" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">your page (React)</text>

  <!-- editorial aside -->
  <text x="32" y="52" fill="#4f5d75" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif">The four metrics mirror the TitleBar props,</text>
  <text x="32" y="72" fill="#4f5d75" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif">so drawn chrome behaves like a real caption.</text>

  <!-- legend -->
  <line x1="32" y1="392" x2="828" y2="392" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <text x="32" y="408" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">ZONES</text>
  <rect x="120" y="400" width="10" height="10" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="136" y="408" fill="#4f5d75" font-size="9">CaptionHeight (40) · drag</text>
  <rect x="320" y="400" width="10" height="10" rx="2" fill="rgba(79,93,117,0.12)" stroke="rgba(122,131,153,0.7)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="336" y="408" fill="#4f5d75" font-size="9">Left (8) / Right (150) reserve</text>
  <line x1="548" y1="405" x2="578" y2="405" stroke="rgba(235,108,54,0.6)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="586" y="408" fill="#4f5d75" font-size="9">ResizeMargin (6) · every edge</text>
</svg>
