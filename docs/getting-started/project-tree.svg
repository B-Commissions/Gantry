<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="tree-title tree-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="tree-title">A Gantry app's layout and the paired-file convention</title>
  <desc id="tree-desc">The app root holds main.go, gantry.json, and the pages and components folders; a page folder pairs a .go logic half with a .tsx look half under one key.</desc>
  <defs>
    <marker id="tr-tick" markerWidth="4" markerHeight="4" refX="2" refY="2"><circle cx="2" cy="2" r="1.5" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- tree connectors (drawn first) -->
  <path d="M 360 84 V 112 H 102 V 136 M 112 112 H 618 M 102 112 V 136 M 266 112 V 136 M 450 112 V 136 M 618 112 V 136" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <path d="M 450 180 V 224" fill="none" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
  <path d="M 450 268 V 296 H 370 V 316 M 370 296 H 538 V 316" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

  <!-- root -->
  <rect x="280" y="40" width="160" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="280" y="40" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="360" y="67" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">myapp/</text>

  <!-- level 1 -->
  <rect x="32" y="136" width="140" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="136" width="140" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="102" y="163" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">main.go</text>

  <rect x="196" y="136" width="140" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="196" y="136" width="140" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="266" y="163" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">gantry.json</text>

  <rect x="384" y="136" width="132" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="384" y="136" width="132" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="450" y="163" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pages/</text>

  <rect x="548" y="136" width="140" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="548" y="136" width="140" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="618" y="163" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">components/</text>

  <!-- index/ folder -->
  <rect x="384" y="224" width="132" height="44" rx="6" fill="#f5f5f5"/>
  <rect x="384" y="224" width="132" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="450" y="251" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">index/</text>

  <!-- the pair (focal) -->
  <rect x="300" y="316" width="140" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="300" y="316" width="140" height="52" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="370" y="340" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">index.go</text>
  <text x="370" y="356" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">logic (Go)</text>

  <rect x="468" y="316" width="140" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="468" y="316" width="140" height="52" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="538" y="340" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">index.tsx</text>
  <text x="538" y="356" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">look (React)</text>

  <!-- pair key tie -->
  <text x="454" y="392" fill="#eb6c36" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">paired by key · pages/index</text>

  <!-- aside -->
  <text x="688" y="248" fill="#4f5d75" font-size="13" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="end">gantry_*.go, .gantry/,</text>
  <text x="688" y="266" fill="#4f5d75" font-size="13" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="end">webdist/, dist/ are</text>
  <text x="688" y="284" fill="#4f5d75" font-size="13" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="end">generated. Never edit.</text>
</svg>
