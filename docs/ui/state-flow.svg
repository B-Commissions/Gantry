<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="state-title state-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="state-title">Shared state that both Go and React own</title>
  <desc id="state-desc">useGoState is a value declared in Go with ui.NewState; a Go Set pushes it to React, and a React setVolume writes it back to Go, firing OnChange, over one websocket.</desc>
  <defs>
    <marker id="sf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- shared value channel (focal) -->
  <text x="450" y="116" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">volume · shared value</text>
  <rect x="436" y="128" width="28" height="128" rx="6" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>

  <!-- arrows -->
  <path d="M 264 168 H 636" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sf-arrow)"/>
  <path d="M 636 216 H 264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sf-arrow)"/>

  <!-- arrow labels -->
  <rect x="316" y="148" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="360" y="157" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SET() -&gt; PUSH</text>
  <rect x="500" y="196" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="560" y="205" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">SETVOLUME -&gt; WRITE</text>
  <rect x="506" y="222" width="108" height="12" rx="2" fill="#f5f5f5"/>
  <text x="560" y="231" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">(fires OnChange)</text>

  <!-- Go half -->
  <rect x="48" y="132" width="216" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="132" width="216" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="56" y="140" width="26" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="69" y="149" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">GO</text>
  <text x="156" y="176" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Go</text>
  <text x="156" y="196" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ui.NewState(app, ...)</text>
  <text x="156" y="228" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Get · Set · OnChange</text>

  <!-- React half -->
  <rect x="636" y="132" width="216" height="120" rx="6" fill="#f5f5f5"/>
  <rect x="636" y="132" width="216" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="644" y="140" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="659" y="149" fill="rgba(45,49,66,0.8)" font-size="7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TSX</text>
  <text x="744" y="176" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">React</text>
  <text x="744" y="196" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">useGoState(key)</text>
  <text x="744" y="228" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">[volume, setVolume]</text>

  <!-- aside -->
  <text x="450" y="300" fill="#4f5d75" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="middle">React applies locally at once, then writes through. A write is never echoed to its writer.</text>

  <!-- legend -->
  <line x1="32" y1="332" x2="868" y2="332" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <text x="32" y="348" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="345" x2="150" y2="345" stroke="#4f5d75" stroke-width="1"/>
  <text x="158" y="348" fill="#4f5d75" font-size="9">sync over /gantry/ws</text>
  <rect x="300" y="340" width="10" height="10" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="316" y="348" fill="#4f5d75" font-size="9">the shared value</text>
</svg>
