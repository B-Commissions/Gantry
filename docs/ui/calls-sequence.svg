<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="calls-title calls-desc" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="calls-title">How an awaited Go call resolves</title>
  <desc id="calls-desc">React awaits a call by key and name; Go resolves the target as page then component then service, runs the handler on its own goroutine, and replies by resolving with data or rejecting with an error and code.</desc>
  <defs>
    <marker id="cs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="cs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- lifelines -->
  <line x1="200" y1="88" x2="200" y2="360" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="620" y1="88" x2="620" y2="360" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- resolve note on the Go side -->
  <rect x="452" y="160" width="356" height="72" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
  <text x="470" y="184" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resolve target, in order:</text>
  <text x="470" y="202" fill="#2d3142" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">page  -&gt;  component  -&gt;  service</text>
  <text x="470" y="222" fill="#7a8399" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">then run on its own goroutine</text>

  <!-- messages -->
  <path d="M 200 128 H 620" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#cs-arrow)"/>
  <rect x="308" y="108" width="204" height="12" rx="2" fill="#f5f5f5"/>
  <text x="410" y="117" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">call · key, name, id, payload</text>

  <path d="M 620 268 H 200" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cs-arrow-accent)"/>
  <rect x="336" y="248" width="148" height="12" rx="2" fill="#f5f5f5"/>
  <text x="410" y="257" fill="#eb6c36" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">reply · resolve(data)</text>

  <path d="M 620 304 H 200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#cs-arrow)"/>
  <rect x="326" y="284" width="168" height="12" rx="2" fill="#f5f5f5"/>
  <text x="410" y="293" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">reply · reject(err, code)</text>

  <!-- actor headers -->
  <rect x="120" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="120" y="40" width="160" height="48" rx="6" fill="rgba(79,93,117,0.1)" stroke="#7a8399" stroke-width="1"/>
  <text x="200" y="62" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">React</text>
  <text x="200" y="78" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">useCall / call</text>

  <rect x="540" y="40" width="160" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="540" y="40" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="620" y="62" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Go</text>
  <text x="620" y="78" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ui.Calls</text>

  <!-- aside -->
  <text x="200" y="344" fill="#4f5d75" font-size="13" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="middle">No reply in 30s -&gt; timeout (a plain Error, code null). A panic -&gt; panic.call.</text>

  <!-- legend -->
  <line x1="32" y1="384" x2="828" y2="384" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
  <text x="32" y="400" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="120" y1="397" x2="150" y2="397" stroke="#4f5d75" stroke-width="1"/>
  <text x="158" y="400" fill="#4f5d75" font-size="9">call</text>
  <rect x="222" y="392" width="10" height="10" rx="2" fill="#fdeee6" stroke="#eb6c36" stroke-width="1"/>
  <text x="238" y="400" fill="#4f5d75" font-size="9">resolve</text>
  <line x1="322" y1="397" x2="352" y2="397" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="360" y="400" fill="#4f5d75" font-size="9">reject</text>
</svg>
